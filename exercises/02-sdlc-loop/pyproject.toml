[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdlc-workshop"
version = "0.1.0"
description = "A tiny live-poll app for practicing an agentic SDLC end to end."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["streamlit>=1.37", "pandas>=2.0"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools]
packages = ["poll"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
